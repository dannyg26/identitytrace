# Reproducible local deployment (blueprint §5.1, §14.1). Bring up the
# whole stack - Postgres + the app talking to it - with:
#   docker compose up --build
# then open http://localhost:8000
#
# SQLite (no Postgres) is still the default for a plain local run without
# Docker at all - see README.md's Quick Start and .env.example. Compose is
# for when you want the Postgres path, or a fully containerized demo.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: identitytrace
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: identitytrace
    volumes:
      - identitytrace_pgdata:/var/lib/postgresql/data
    secrets: [db_password]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identitytrace"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      IDENTITYTRACE_DB_HOST: postgres
      IDENTITYTRACE_DB_PASSWORD_FILE: /run/secrets/db_password
      IDENTITYTRACE_CREDENTIALS_FILE: /run/secrets/app_credentials
    secrets: [db_password, app_credentials]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    pids_limit: 128
    mem_limit: 1g
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  identitytrace_pgdata:

secrets:
  db_password:
    file: ${IDENTITYTRACE_DB_PASSWORD_FILE:?Set IDENTITYTRACE_DB_PASSWORD_FILE}
  app_credentials:
    file: ${IDENTITYTRACE_CREDENTIALS_FILE:?Set IDENTITYTRACE_CREDENTIALS_FILE}
