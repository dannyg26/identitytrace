[project]
name = "identitytrace"
version = "1.3.0"
description = "Cross-SaaS identity attack detection platform (blue-team research project)"
requires-python = ">=3.11"
dependencies = [
    "Authlib>=1.6,<2",
    "itsdangerous>=2.2,<3",
    "requests>=2.31",
    "PyJWT[crypto]>=2.13,<3",
    "python-docx>=1.1,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "networkx>=3.0",
    "numpy>=1.26",  # networkx's spring_layout requires it; not otherwise a hard dependency
    "psycopg[binary]>=3.1",  # Postgres driver - so docker-compose's app+postgres pairing works out of the box
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "pytest-cov>=5.0",
]
real-collection = [
    # scripts/collect_entra_telemetry.py only - not needed to run the app
    # or its tests. GitHub collection uses the gh CLI instead (see
    # scripts/collect_github_telemetry.py and docs/phase9b-first-collection-checklist.md).
    "msal>=1.28",
    "requests>=2.31",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
    "E501",  # line length is a soft target here, not a build-breaker
    "B008",  # FastAPI's Depends()/Body()/model-default-in-signature idiom, used throughout app/api/
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "infra*", "scripts*"]

[tool.setuptools.data-files]
"share/identitytrace/detections/entra" = ["detections/entra/*.yaml"]
"share/identitytrace/detections/github" = ["detections/github/*.yaml"]
"share/identitytrace/detections/m365" = ["detections/m365/*.yaml"]
"share/identitytrace/detections/cross_domain" = ["detections/cross_domain/*.yaml"]
"share/identitytrace/correlations" = ["correlations/*.yaml"]
"share/identitytrace/dashboard/templates" = ["dashboard/templates/*.html"]
