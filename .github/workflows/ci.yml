# Lint, behavioral regression, installed-container smoke and PostgreSQL checks.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check app tests scripts infra

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Schema validation for detection/correlation YAML (blueprint §12.3)
      # is exercised as part of the suite itself - load_rules()/
      # load_correlation_rules() against the real shipped files are
      # asserted in tests/unit/test_detection_loader.py and
      # test_correlation_loader.py, so a malformed rule fails CI here
      # rather than needing a separate step.
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=90

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t identitytrace .
      # Scenario smoke test (blueprint §12.3): boot the built image for
      # real and confirm the API/dashboard actually come up - not just
      # that the image builds.
      - run: |
          python -c 'import hashlib,json,os; json.dump([{"name":"ci","role":"admin","token_hash":hashlib.sha256(b"ci-smoke-token").hexdigest()}],open(os.environ["RUNNER_TEMP"]+"/identitytrace-credentials.json","w"))'
          docker run -d --name identitytrace-smoke -p 127.0.0.1:8000:8000 -e IDENTITYTRACE_CREDENTIALS_FILE=/run/credentials.json -v "$RUNNER_TEMP/identitytrace-credentials.json:/run/credentials.json:ro" identitytrace
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8000/health
          curl -sf -X POST http://localhost:8000/api/events \
            -H 'Authorization: Bearer ci-smoke-token' \
            -H "Content-Type: application/json" \
            -d '{"source":"entra","raw":{"id":"ci-smoke-1","createdDateTime":"2026-01-01T00:00:00Z","userPrincipalName":"ci@example.test","status":{"errorCode":0},"authenticationProtocol":"deviceCode"}}'
          curl -sf -H 'Authorization: Bearer ci-smoke-token' http://localhost:8000/api/events | grep -q "ci-smoke-1"
          curl -sf -H 'Authorization: Bearer ci-smoke-token' http://localhost:8000/rules | grep -q "IDT-ENTRA-001"
          docker logs identitytrace-smoke
          docker stop identitytrace-smoke

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: identitytrace
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: identitytrace_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/integration
        env:
          IDENTITYTRACE_TEST_DATABASE_URL: postgresql+psycopg://identitytrace:ci-test-only@localhost:5432/identitytrace_test
