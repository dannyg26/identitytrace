<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}IdentityTrace{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #0f1420; color: #e6e9f0; }
    header { padding: 16px 24px; background: #141a2b; border-bottom: 1px solid #232b42; display: flex; align-items: center; gap: 24px; }
    header a { color: #8fb3ff; text-decoration: none; font-weight: 600; }
    header a.brand { color: #e6e9f0; font-size: 1.1rem; }
    main { padding: 24px; max-width: 1100px; margin: 0 auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #232b42; }
    th { color: #9aa3bd; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; background: #232b42; color: #8fb3ff; }
    .sev-low { color: #8fb3ff; }
    .sev-medium { color: #e0c341; }
    .sev-high { color: #e0913f; }
    .sev-critical { color: #e05f5f; font-weight: 700; }
    .enabled-yes { color: #6fcf7a; }
    .enabled-no { color: #6b7290; }
    .reason-list { margin: 4px 0 0 0; padding-left: 18px; font-size: 0.8rem; color: #9aa3bd; }
    .stat-row { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .stat-card { background: #141a2b; border: 1px solid #232b42; border-radius: 10px; padding: 16px 20px; min-width: 140px; }
    .stat-card .value { font-size: 1.6rem; font-weight: 700; }
    .stat-card .label { color: #9aa3bd; font-size: 0.8rem; }
    form.filters { margin-bottom: 16px; display: flex; gap: 8px; }
    form.filters input { background: #141a2b; border: 1px solid #232b42; color: inherit; padding: 6px 10px; border-radius: 6px; }
    form.filters button { background: #2f5fe0; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; }
    select, textarea { background: #141a2b; border: 1px solid #232b42; color: inherit; padding: 6px 10px; border-radius: 6px; font-family: inherit; }
    .btn { background: #2f5fe0; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-family: inherit; }
    dl.kv { display: grid; grid-template-columns: 220px 1fr; gap: 6px 12px; margin: 0; }
    dl.kv dt { color: #9aa3bd; }
    dl.kv dd { margin: 0; }
    code { background: #141a2b; padding: 1px 5px; border-radius: 4px; }
    main a { color: #8fb3ff; text-decoration: none; }
    main a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">IdentityTrace</a>
    <a href="/">Overview</a>
    <a href="/incidents">Incidents</a>
    <a href="/events">Events</a>
    <a href="/rules">Detections</a>
    <a href="/identities">Identities</a>
    <a href="/evaluation">Evaluation</a>
    <a href="/docs">API docs</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
